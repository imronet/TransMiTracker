[project]
name = "transmitracker"
version = "0.5.0"
description = "Catálogo GTFS y perfiles de escritorio de TransMilenio/SITP"
requires-python = ">=3.12"
dependencies = [
    "customtkinter==6.0.0",
    "httpx==0.28.1",
    "gtfs-realtime-bindings==3.0.0",
    "protobuf==7.36.2",
    "tzdata==2026.6",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --basetemp=.cache/pytest"
markers = ["gui: ventanas Tk reales, separadas de pruebas de controladores y servicios"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
